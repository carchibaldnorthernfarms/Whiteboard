name: Update board data

on:
  repository_dispatch:
    types: [update-board]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write board.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = context.payload.client_payload.data;
            fs.writeFileSync('board.json', data);

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add board.json
          git diff --staged --quiet || git commit -m "update board data"

          n=0
          until [ $n -ge 5 ]
          do
            if git push; then
              break
            fi
            n=$((n+1))
            echo "Push rejected (attempt $n) — fetching latest and retrying..."
            git fetch origin main
            git rebase origin/main -X theirs || { git rebase --abort; exit 1; }
            sleep $((n * 2))
          done

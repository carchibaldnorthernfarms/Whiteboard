name: Update board data

on:
  repository_dispatch:
    types: [update-board]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write board.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = context.payload.client_payload.data;
            fs.writeFileSync('board.json', JSON.stringify(data));

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add board.json
          git diff --staged --quiet || git commit -m "update board data"
          git push
